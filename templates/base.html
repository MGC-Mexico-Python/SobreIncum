<!DOCTYPE html>
<html lang="es">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            Crédito y Garantías
        </title>

        <link rel="icon" href="{{ url_for('static', filename='img/icon_MGC.ico') }}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
        {% block estilos %}
        {% endblock %}
    </head>

    <body>
        <header class="encabezado">
            <span class="logo">
                Crédito y Garantías
            </span>
            
            <img src="/static/img/logo_MGC.png" alt="Logo MGC" class="logo-img">
        </header>

        <nav class="categorias" aria-label="Categorias">
            <a href="{{ url_for('sobregiros') }}">
                Sobregiros
            </a>
            <a href="{{ url_for('incumplimientos') }}">
                Incumplimientos
            </a>
            <a href="#">
                Historial
            </a>
            <a href="#">
                Información
            </a>
            <a href="#">
                Líneas de crédito
            </a>            
        </nav>

        <main class="contenido">
            {% block contenido %}
            {% endblock %}
        </main>
    </body>

</html>
